<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Giddi’s Kitchen Husch</title>
<meta name="description" content="Isometrisches 3D-Kochspiel für Browser und Homescreen">
<meta name="theme-color" content="#2a1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Husch">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* ============================================================
   STYLES – Cozy-UI-Look (Assets: assets/ui/*, dobo_ui Demo-Pack)
   ============================================================ */
:root{
  --cream:#fff8e6; --cream2:#f6e7c8; --cream3:#ead3aa;
  --brown:#7a3e2e; --brown2:#a0563f; --ink:#4a2a20;
  --wood:#d99a73; --wood2:#c07c56; --wood3:#9c5a3c;
  --red:#ef5b5b; --red2:#b93a3a; --green:#79c23d; --green2:#4c8f22;
  --blue:#3aa7d8; --blue2:#1f7aa6; --gold:#ffc83d; --gold2:#d8941c;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --pad: 10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a14;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
#app{position:fixed;inset:0;width:100vw;height:100%;height:100dvh;overflow:hidden;font-family:var(--font);color:var(--ink)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
img{-webkit-user-drag:none;user-select:none}

/* ---------- Ladebildschirm ---------- */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 35%,#5a3424,#2a1a14 70%);z-index:60;color:var(--cream);text-align:center;padding:24px}
#loading h1{margin:0;font-size:clamp(30px,7vw,54px);letter-spacing:.5px;text-shadow:0 4px 0 #00000055}
#loading .bar{width:min(320px,70vw);height:22px;border-radius:12px;background:#00000055;border:3px solid var(--cream);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(#ffd56a,#f0a63c);transition:width .2s}
#loading p{margin:0;opacity:.85;font-size:14px;max-width:420px}
#loading .err{color:#ffb4a4;font-weight:700}

/* ---------- Grundbausteine ---------- */
.panel{border:22px solid transparent;border-image:url(assets/ui/Container1.png) 64 fill / 22px stretch;color:var(--cream)}
.paper{background:var(--cream);border:3px solid var(--brown2);border-radius:16px;box-shadow:0 4px 0 var(--brown2);color:var(--ink)}
.card{border:16px solid transparent;border-image:url(assets/ui/CardRegular1_wood.png) 70 44 46 44 fill / 34px 18px 18px 18px stretch;color:var(--ink)}
.card.red{border-image-source:url(assets/ui/CardRegular1_red.png)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:4px 18px;
  border:12px solid transparent;border-image:url(assets/ui/SquareButton2_white.png) 46 54 58 54 fill / 12px 14px 16px 14px stretch;
  background:none;font-weight:800;font-size:17px;color:var(--brown);letter-spacing:.2px;line-height:1.1;text-align:center;
  transition:transform .08s;min-width:0}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.wood{border-image-source:url(assets/ui/SquareButton2_wood.png);color:#fff;text-shadow:0 2px 0 #00000040}
.btn.red{border-image-source:url(assets/ui/SquareButton2_red.png);color:#fff;text-shadow:0 2px 0 #00000040}
.btn.green{border-image:none;border:3px solid #4a6e1c;border-radius:16px;background:linear-gradient(#93d64f,#6cb52c);
  box-shadow:inset 0 -5px 0 #4f8f20,0 3px 0 #00000030;color:#fff;text-shadow:0 2px 0 #00000040;padding:8px 18px}
.btn.small{min-height:40px;font-size:14px;padding:2px 10px}
.btn[disabled],.btn.disabled{filter:grayscale(.8) brightness(.9);opacity:.7}
.btn svg{width:22px;height:22px;flex:none}
.round{width:58px;height:62px;background:url(assets/ui/RoundButton1_white.png) center/contain no-repeat;border:0;
  display:flex;align-items:center;justify-content:center;padding:0 0 6px;color:var(--brown)}
.round:active{transform:scale(.94)}
.round svg{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:20px;background:#fff8e6ee;
  border:3px solid var(--brown2);box-shadow:0 3px 0 #00000035;font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap}
.pill svg{width:20px;height:20px}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc83d 45%,#d8941c);
  border:2px solid #a0661a;flex:none;box-shadow:inset 0 -2px 0 #c07b16}
.coin.big{width:28px;height:28px}
.star{display:inline-block;width:22px;height:22px;flex:none;background:#00000030;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 92%,50% 70%,21% 92%,32% 57%,2% 35%,39% 35%)}
.star.on{background:linear-gradient(#ffe27a,#ffb420)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:800;background:var(--cream3);color:var(--brown)}
.tag.green{background:#d6f2b8;color:#2f6a12}.tag.red{background:#ffd3cc;color:#9a2a1c}.tag.blue{background:#cdebfa;color:#145a7c}
.muted{opacity:.75}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud-top{position:absolute;z-index:3;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);top:calc(var(--sat) + 6px);
  display:flex;align-items:flex-start;gap:8px}
.hud-left{display:flex;flex-direction:column;gap:6px;flex:none}
#hud-timer.low{background:#ffd3cc;animation:pulse 1s infinite}
#hud-center{flex:1;display:flex;gap:10px;align-items:flex-start;justify-content:center;min-width:0}
#orders{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-width:0}
#btn-pause{pointer-events:auto;flex:none}
.order{position:relative;width:158px;height:58px;padding:4px 6px 4px 4px;border-radius:14px;background:#fff8e6f2;border:3px solid var(--brown2);
  box-shadow:0 3px 0 #00000035;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto 7px;column-gap:4px;row-gap:2px;align-items:center;transition:transform .2s,opacity .3s}
.order .num{position:absolute;left:-7px;top:-7px;width:22px;height:22px;border-radius:50%;background:var(--brown);color:#fff;z-index:1;
  font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.order .dish{grid-row:1/4;width:44px;height:44px;object-fit:contain}
.order .o-name{font-size:11px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.order .o-mid{display:flex;align-items:center;gap:3px;min-width:0}
.order .o-parts{display:flex;gap:1px;flex:1;min-width:0;overflow:hidden}
.order .o-parts span{position:relative;width:20px;height:20px;flex:none}
.order .o-parts img{width:20px;height:20px;object-fit:contain}
.order .o-parts span.done img{opacity:.35}
.order .o-parts span.done::after{content:"";position:absolute;right:-1px;bottom:0;width:9px;height:9px;border-radius:50%;background:var(--green);border:1.5px solid #fff}
.order .o-parts b{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:1px solid var(--brown2);display:flex;align-items:center;justify-content:center}
.order .o-parts b svg{width:8px;height:8px}
.order .o-pat{height:7px;border-radius:4px;background:#00000022;overflow:hidden}
.order .o-pat i{display:block;height:100%;background:var(--green);border-radius:4px}
.order .o-status{position:absolute;right:8px;top:-11px;font-size:9px;font-weight:900;color:#fff;background:var(--brown2);border-radius:7px;padding:1px 5px;white-space:nowrap;border:1.5px solid #fff}
.order[data-status=working]{border-color:var(--blue2)}
.order[data-status=working] .o-status{background:var(--blue2)}
.order[data-status=ready]{border-color:var(--green2);background:#effbe0f2}
.order[data-status=ready] .o-status{background:var(--green2)}
.order[data-status=arriving]{opacity:.75}
.order.urgent{animation:shake .5s infinite;border-color:var(--red)}
.order.gone{transform:scale(.6);opacity:0;transition:all .35s}

/* Tutorial-Hinweis sitzt im oberen Streifen neben den Bestellungen – verdeckt nie die Küche */
#tutorial-banner{position:relative;flex:1 1 300px;max-width:480px;min-width:0;pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:#fff8e6f4;border:3px solid var(--blue2);border-radius:14px;box-shadow:0 3px 0 #00000035;font-size:13px;font-weight:700;line-height:1.22;min-height:58px}
#tutorial-banner .step{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
#tutorial-banner .txt{flex:1;min-width:0}
#tutorial-banner .tut-skip{position:absolute;right:8px;top:-14px;min-height:26px;padding:2px 10px;border-radius:13px;border:2px solid #fff;background:var(--blue2);color:#fff;font-size:12px;font-weight:800;box-shadow:0 2px 0 #00000030}

/* Steuerung */
#joy-zone{position:absolute;inset:0;pointer-events:auto;z-index:1}
#joystick{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;pointer-events:none;z-index:2;opacity:.55;transition:opacity .15s}
#joystick.active{opacity:.95;transition:none}
#joystick .base{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff8e655,#fff8e622 65%);border:4px solid #fff8e6cc;box-shadow:0 4px 0 #00000030}
#joystick .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fffdf5,#f1dcb2);border:4px solid var(--brown2);box-shadow:0 4px 0 #00000040}
#action-wrap{position:absolute;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 18px);z-index:3;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
body.lefty #action-wrap{right:auto;left:calc(var(--sal) + 18px);flex-direction:row-reverse}
#btn-action{pointer-events:auto;width:112px;height:120px;border:0;background:url(assets/ui/RoundButton1_white.png) center/contain no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px 12px;color:var(--brown);gap:2px}
#btn-action .ico svg{width:34px;height:34px}
#btn-action .lbl{font-weight:900;font-size:13px;line-height:1.05;max-width:84px;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;hyphens:auto}
#btn-action .lbl.long{font-size:11px}
#btn-action.off{filter:grayscale(.85) brightness(.95)}
#btn-action.off .lbl{opacity:.75}
#btn-action.press{transform:scale(.92)}
#btn-action.shake{animation:shake .3s}
#held{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:6px;transition:opacity .15s}
#held .slot{width:64px;height:68px;background:url(assets/ui/ItemSlot1.png) center/contain no-repeat;display:flex;align-items:center;justify-content:center;padding-bottom:4px}
#held .slot img{width:44px;height:44px;object-fit:contain}
#held span{font-size:11px;font-weight:800;color:var(--cream);text-shadow:0 1px 2px #000,0 0 4px #000;max-width:90px;text-align:center;line-height:1.1}
#held.empty{opacity:.0}

/* Welt-Overlays (über Stationen und Gästen) */
#world-ui{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.wui{position:absolute;left:0;top:0;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-9999px,0)}
.sui-row{display:flex;gap:2px;align-items:center;background:#fff8e6ee;border:2px solid var(--brown2);border-radius:12px;padding:2px 4px;box-shadow:0 2px 0 #00000030}
.sui-row img{width:26px;height:26px;object-fit:contain}
.sui-row svg{width:20px;height:20px}
.sui-bar{width:58px;height:9px;border-radius:5px;background:#3d241a;border:2px solid #fff8e6;overflow:hidden;box-shadow:0 2px 0 #00000030}
.sui-bar i{display:block;height:100%;width:0;background:var(--gold)}
.sui-bar.chop i{background:var(--blue)}
.sui-bar.done i{background:var(--green)}
.sui-bar.burn i{background:var(--red)}
.wui.warn .sui-row{border-color:var(--red);background:#ffe1dc;animation:pulse .5s infinite}
.wui .lbl{font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.slotnum{width:26px;height:26px;border-radius:50%;background:var(--brown);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 0 #00000040}
.gbubble{display:flex;align-items:center;gap:2px;background:#fff8e6f4;border:2px solid var(--brown2);border-radius:14px;padding:1px 4px 1px 2px;box-shadow:0 2px 0 #00000035}
.gbubble img{width:30px;height:30px;object-fit:contain}
.gbubble .ring{width:22px;height:22px;display:block}
.gbubble .gnum{font-weight:900;font-size:13px;color:var(--brown);padding-left:2px}
.wui.compact .gbubble img{display:none}
.wui.compact .gbubble{padding:1px 3px 1px 4px}
.wui.angry .gbubble{border-color:var(--red)}
.wui.happy .gbubble{border-color:var(--green2)}
.floater{position:absolute;left:0;top:0;font-weight:900;font-size:18px;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 2px 0 #00000080,0 0 6px #00000060;z-index:7;transition:transform 1.1s ease-out,opacity 1.1s ease-in}
.floater.coins{color:#ffe27a}.floater.bad{color:#ff8b7a}.floater.good{color:#b9f27a}

/* Toasts */
#toasts{position:absolute;left:0;right:0;top:calc(var(--sat) + 76px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:40}
.toast{max-width:min(420px,86vw);padding:4px 12px 4px 26px;border:8px solid transparent;
  border-image:url(assets/ui/NoteContainerSimple.png) 40 40 40 110 fill / 8px 10px 8px 22px stretch;
  font-weight:800;font-size:14px;color:var(--ink);text-align:center;animation:toastIn .2s ease-out}
.toast.bad{color:#9a2a1c}.toast.good{color:#2f6a12}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}

/* Bildschirme / Menüs */
#screen-root{position:absolute;inset:0;z-index:30;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);background:#1d100b88;
  animation:fadeIn .18s ease-out}
.screen.clear{background:linear-gradient(90deg,#1d100bcc,#1d100b33 55%,#1d100b00)}
.sheet{position:relative;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column}
.sheet.narrow{width:min(440px,100%)}
.sheet-head{display:flex;align-items:center;gap:10px;margin:-6px 0 8px}
.sheet-head h2{flex:1;margin:0;font-size:24px;color:var(--cream);text-shadow:0 2px 0 #00000045}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0;padding:2px 2px 6px}
.banner{display:inline-block;padding:6px 26px;border:14px solid transparent;border-image:url(assets/ui/WoodenContainer1.png) 70 120 70 120 fill / 14px 30px 14px 30px stretch;
  color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 0 #00000045}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.list{display:flex;flex-direction:column;gap:8px}

/* Hauptmenü */
.menu-wrap{position:absolute;inset:0;display:flex;align-items:center;padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);pointer-events:auto}
.menu-col{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.title{margin:0 0 6px;font-size:clamp(34px,6.2vw,56px);line-height:.95;color:var(--cream);text-shadow:0 4px 0 var(--brown),0 7px 0 #00000045;letter-spacing:.5px;white-space:nowrap}
.title .pre{display:block;font-size:.5em;line-height:1;margin-bottom:2px;color:#ffd68a;transform:rotate(-3deg);transform-origin:left bottom;letter-spacing:1px}
.title small{display:block;font-size:.34em;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;color:#ffe2b8;text-shadow:0 2px 0 #00000055}
.menu-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.xpbar{height:10px;border-radius:6px;background:#00000040;overflow:hidden;border:2px solid var(--cream);width:120px}
.xpbar i{display:block;height:100%;background:linear-gradient(#9fe36a,#63b52b)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-grid .btn{font-size:15px}

/* Level-Karte */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{position:relative;padding:10px;border-radius:16px;background:var(--cream);border:3px solid var(--brown2);box-shadow:0 4px 0 var(--brown2);
  color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px}
.lvl .n{font-size:12px;font-weight:900;color:var(--brown2);text-transform:uppercase}
.lvl .t{font-size:16px;font-weight:900;line-height:1.1}
.lvl .d{font-size:12px;opacity:.8}
.lvl.locked{filter:grayscale(1);opacity:.6}
.lvl.next{border-color:var(--green2);box-shadow:0 4px 0 var(--green2)}
.lvl .stars{display:flex;gap:2px}
.lvl .stars .star{width:18px;height:18px}
.lvl-detail{padding:12px}

/* Shop / Rezeptbuch */
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs .btn{flex:1}
.tabs .btn.sel{border-image-source:url(assets/ui/SquareButton2_wood.png);color:#fff}
.rc{display:flex;flex-direction:column;gap:6px;padding:4px 6px}
.rc-top{display:flex;gap:8px;align-items:center}
.rc-top img{width:64px;height:64px;object-fit:contain;flex:none}
.rc h3{margin:0;font-size:16px;line-height:1.1}
.rc .meta{font-size:12px;display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.flow{display:flex;flex-direction:column;gap:3px;font-size:12px}
.flow .f{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.flow img{width:24px;height:24px;object-fit:contain}
.flow .arr{opacity:.6}
.flow .st{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:8px;background:var(--cream3);font-weight:700}
.flow .st svg{width:13px;height:13px}
.owned{color:var(--green2);font-weight:900;display:inline-flex;align-items:center;gap:4px}
.upg{display:flex;gap:10px;align-items:center;padding:6px 8px}
.upg .ui{width:52px;height:52px;flex:none;border-radius:14px;background:var(--cream3);display:flex;align-items:center;justify-content:center}
.upg .ui svg,.upg .ui img{width:34px;height:34px}
.upg .info{flex:1;min-width:0}
.upg h3{margin:0;font-size:15px}
.upg .lv{display:flex;gap:3px;margin:3px 0}
.upg .lv i{width:16px;height:8px;border-radius:4px;background:#00000025}
.upg .lv i.on{background:var(--green)}
.upg .eff{font-size:12px;font-weight:700}
.upg .eff b{color:var(--green2)}

/* Ergebnis */
.result-stars{display:flex;justify-content:center;gap:10px;margin:2px 0 8px}
.result-stars .star{width:58px;height:58px;transform:scale(.4);opacity:.3;transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.result-stars .star.show{transform:scale(1);opacity:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;font-weight:700}
.kv b{text-align:right}
.result-new{margin-top:8px;padding:8px 10px;border-radius:12px;background:#ffffff25;font-weight:700;font-size:13px;line-height:1.3}
.result-new div+div{margin-top:4px}
.sheet.results{width:min(640px,100%)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.res-grid .kv{font-size:14px}
@media (max-width:560px){.res-grid{grid-template-columns:1fr}}
@media (max-height:430px){.result-stars .star{width:46px;height:46px}.result-stars{margin:0 0 4px}}

/* Einstellungen */
.set-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#ffffff1f;margin-bottom:6px;font-weight:700}
.set-row .lab{flex:1}
.set-row small{display:block;font-weight:600;opacity:.8;font-size:12px}
.chk{width:44px;height:46px;border:0;background:url(assets/ui/Checkbox2_unchecked.png) center/contain no-repeat;flex:none}
.chk.on{background-image:url(assets/ui/Checkbox2_checked.png)}
.seg{display:flex;gap:4px}
.seg button{border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
.seg button.sel{background:var(--cream);color:var(--brown)}
input[type=range]{width:120px;accent-color:var(--gold);touch-action:pan-x}
.help h3{margin:10px 0 4px;color:#ffe2b8}
.help p,.help li{font-size:14px;line-height:1.35;margin:4px 0}
.help kbd{display:inline-block;padding:0 6px;border-radius:6px;background:var(--cream);color:var(--brown);font-family:inherit;font-weight:800;border-bottom:3px solid var(--brown2)}
.modal-text{font-size:15px;line-height:1.4;margin:4px 0 12px}
textarea.code{width:100%;height:150px;border-radius:12px;border:3px solid var(--brown2);background:var(--cream);color:var(--ink);font:12px/1.35 ui-monospace,Menlo,monospace;padding:8px;resize:none;-webkit-user-select:text;user-select:text;touch-action:pan-y}

/* Countdown & Hinweise */
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:25}
#countdown span{font-size:clamp(60px,14vw,120px);font-weight:900;color:#fff;text-shadow:0 6px 0 var(--brown),0 10px 18px #00000080;animation:pop .6s ease-out}
#rotate-hint{position:absolute;left:50%;bottom:calc(var(--sab) + 150px);transform:translateX(-50%);z-index:45;padding:8px 14px;border-radius:14px;background:#000000aa;color:#fff;font-weight:700;font-size:14px;pointer-events:auto;text-align:center}
#debug-panel{position:absolute;left:calc(var(--sal) + 8px);bottom:calc(var(--sab) + 8px);z-index:50;background:#000000cc;color:#fff;border-radius:12px;padding:8px;font:12px/1.3 ui-monospace,monospace;display:flex;flex-wrap:wrap;gap:4px;max-width:340px;pointer-events:auto}
#debug-panel button{background:#333;border:1px solid #777;border-radius:6px;padding:5px 7px;color:#fff;font:inherit}
#debug-panel .fps{width:100%}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
body.reduced *{animation:none!important;transition:none!important}

/* kleine / niedrige Displays */
@media (max-height:430px){
  .order{width:146px;height:54px}.order .dish{width:40px;height:40px}.order{grid-template-columns:40px 1fr}
  #toasts{top:calc(var(--sat) + 70px)}
  .pill{height:32px;font-size:14px}
  #btn-action{width:100px;height:108px}
  .sheet-head h2{font-size:20px}
  .btn{min-height:46px;font-size:15px}
  .menu-col{gap:7px}
  .title{font-size:44px;margin-bottom:2px}
  .title small{display:none}
  .menu-stats{margin-bottom:0}
}
@media (max-width:520px){
  .menu-wrap{align-items:flex-end}
  .menu-col{width:100%}
}
/* Hochformat: oben Anzeigen + Bestellungen (2 Spalten) + Tutorial-Hinweis, Mitte Küche, unten Steuerung */
@media (orientation:portrait){
  #hud-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
  .hud-left{grid-row:1;grid-column:1;flex-direction:row;gap:5px;min-width:0}
  #btn-pause{grid-row:1;grid-column:2;width:48px;height:52px}
  #hud-center{grid-row:2;grid-column:1/-1;flex-direction:column;align-items:stretch;gap:12px}
  #orders{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;padding-top:6px}
  #orders:empty{display:none}
  .order{width:auto}
  #tutorial-banner{max-width:none;flex:none}
  .pill{height:32px;font-size:14px;padding:0 9px 0 6px;gap:4px}
  .pill svg{width:17px;height:17px}.pill .coin{width:17px;height:17px}
  #toasts{top:calc(var(--sat) + 200px)}
  #rotate-hint{bottom:calc(var(--sab) + 200px)}
}

<script type="module">
/* =====================================================================
   GIDDI’S KITCHEN HUSCH – isometrisches 3D-Kochspiel (Three.js r169, lokal)

import * as THREE from './lib/three/three.module.min.js';
import { GLTFLoader } from './lib/three/addons/loaders/GLTFLoader.js';

// Level: Dauer (s), Gäste gesamt, max. gleichzeitige Gäste, Rezept-Pool, Geduld-Faktor, Abstand zwischen Gästen
const LEVELS = [

function autoQuality() {

function defaultSave() {
  return {

  };
}
// Migrationen: MIGRATIONS[n] hebt einen Spielstand von Version n auf n+1
const MIGRATIONS = {
  0: d => ({ ...defaultSave(), ...d, schema: 1 }),
};
function sanitizeSave(d) {
  const def = defaultSave();
  const out = { ...def, ...d };
  const num = (v, min = 0, max = 1e9) => Number.isFinite(+v) ? clamp(Math.floor(+v), min, max) : min;
  out.schema = CONFIG.SAVE.schema;
  out.coins = num(d.coins); out.xp = num(d.xp);
  const known = new Set(RECIPES.map(r => r.id));
  out.recipes = [...new Set([...(Array.isArray(d.recipes) ? d.recipes : []), ...def.recipes])].filter(id => known.has(id));
  out.upgrades = Object.fromEntries(UPGRADES.map(u => [u.id, num(d.upgrades?.[u.id], 0, u.costs.length)]));
  out.levels = {};
  for (const L of LEVELS) {
    const v = d.levels?.[L.id];
    if (v && typeof v === 'object') out.levels[L.id] = { stars: num(v.stars, 0, 3), best: num(v.best), completed: !!v.completed, plays: num(v.plays) };
  }
  const s = { ...def.settings, ...(d.settings || {}) };
  out.settings = {
    sound: !!s.sound, volume: clamp(+s.volume || 0, 0, 1), reducedMotion: !!s.reducedMotion,
    quality: ['high', 'medium', 'low'].includes(s.quality) ? s.quality : def.settings.quality, lefty: !!s.lefty, hints: s.hints !== false,
  };
  out.tutorialDone = !!d.tutorialDone;
  out.stats = Object.fromEntries(Object.keys(def.stats).map(k => [k, num(d.stats?.[k])]));
  return out;
}
function migrateSave(d) {
  if (!d || typeof d !== 'object') return defaultSave();
  let v = Number.isFinite(+d.schema) ? +d.schema : 0;
  let cur = d;
  while (v < CONFIG.SAVE.schema && MIGRATIONS[v]) { cur = MIGRATIONS[v](cur); v = cur.schema; }
  return sanitizeSave(cur);
}
class SaveManager {
  constructor() { this.db = null; this.available = false; this.chain = Promise.resolve(true); this.data = null; this.onError = null; this.lastError = null; }
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB nicht verfügbar'));
      const timer = setTimeout(() => reject(new Error('IndexedDB antwortet nicht')), 5000);
      let req;
      try { req = indexedDB.open(CONFIG.SAVE.db, 1); } catch (e) { clearTimeout(timer); return reject(e); }
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(CONFIG.SAVE.store)) db.createObjectStore(CONFIG.SAVE.store); };
      req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
      req.onerror = () => { clearTimeout(timer); reject(req.error || new Error('IndexedDB-Fehler')); };
      req.onblocked = () => { clearTimeout(timer); reject(new Error('IndexedDB blockiert (anderer Tab offen?)')); };
    });
  }
  tx(mode, fn) {
    return new Promise((resolve, reject) => {
      const t = this.db.transaction(CONFIG.SAVE.store, mode);
      const store = t.objectStore(CONFIG.SAVE.store);
      const req = fn(store);
      t.oncomplete = () => resolve(req?.result);
      t.onerror = () => reject(t.error || new Error('Transaktion fehlgeschlagen'));
      t.onabort = () => reject(t.error || new Error('Transaktion abgebrochen'));
    });
  }
  async init() {
    try { this.db = await this.open(); this.available = true; this.db.onversionchange = () => this.db.close(); }
    catch (e) { this.available = false; this.lastError = e; console.warn('Speicher nicht verfügbar:', e); }
    try { navigator.storage?.persist?.(); } catch (e) { /* optional */ }
  }
  async load() {
    let raw = null, loadError = null;
    if (this.available) {
      try { raw = await this.tx('readonly', s => s.get(CONFIG.SAVE.key)); }
      catch (e) { loadError = e; console.warn('Laden fehlgeschlagen:', e); }
    }
    this.data = raw ? migrateSave(raw) : defaultSave();
    if (!raw && this.available && !loadError) await this.save(); // sicherer Startzustand
    return { data: this.data, isNew: !raw, error: loadError };
  }
  // Speichervorgänge laufen strikt nacheinander (Promise-Kette)
  save() {
    const snap = deepClone(this.data); snap.updated = Date.now();
    this.chain = this.chain.then(async () => {
      if (!this.available) return false;
      await this.tx('readwrite', s => s.put(snap, CONFIG.SAVE.key));
      return true;

class Sfx {
  constructor() { this.ctx = null; this.master = null; this.enabled = true; this.volume = 0.8; this.sizzleNode = null; this.lastWarn = 0; }
  unlock() {
    try {
      if (!this.ctx) {

        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate * 1.0; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const ch = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        this.apply();

      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { console.warn('Audio nicht verfügbar', e); }
  }
  set(enabled, volume) { this.enabled = enabled; this.volume = volume; this.apply(); }
  apply() { if (this.master) this.master.gain.value = this.enabled ? this.volume * 0.55 : 0; }
  suspend() { try { this.ctx?.suspend(); } catch (e) {} }
  resume() { try { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); } catch (e) {} }

    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  }
  noise(dur, vol, freq, type = 'bandpass', when = 0) {

  }
  play(name) {
    if (!this.ctx || !this.enabled) return;

      case 'pickup': this.tone(620, 0.07, 'triangle', 0.22); this.tone(880, 0.08, 'triangle', 0.18, 0.05); break;
      case 'drop': this.tone(320, 0.09, 'sine', 0.28, 0, 170); break;
      case 'chop': this.noise(0.05, 0.4, 3000, 'highpass'); this.tone(1400, 0.025, 'square', 0.04); break;
      case 'ding': this.tone(1320, 0.25, 'sine', 0.22); this.tone(1760, 0.35, 'sine', 0.16, 0.08); break;
      case 'warn': this.tone(880, 0.09, 'square', 0.1); break;
      case 'burn': this.noise(0.6, 0.3, 700, 'lowpass'); this.tone(170, 0.45, 'sawtooth', 0.12, 0, 80); break;
      case 'order': this.tone(1046, 0.14, 'triangle', 0.22); this.tone(1318, 0.22, 'triangle', 0.2, 0.11); break;
      case 'serve': [988, 1318, 1568, 1976].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.2, i * 0.06)); break;
      case 'fail': this.tone(392, 0.2, 'triangle', 0.22); this.tone(294, 0.35, 'triangle', 0.22, 0.17); break;
      case 'error': this.tone(200, 0.13, 'square', 0.1); break;
      case 'click': this.tone(760, 0.04, 'triangle', 0.14); break;
      case 'trash': this.noise(0.18, 0.3, 900, 'lowpass'); break;
      case 'buy': [784, 988, 1318].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.2, i * 0.07)); break;
      case 'win': [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.2, i * 0.11)); break;
      case 'lose': [440, 392, 330, 262].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.18, i * 0.15)); break;
      case 'star': this.tone(1568, 0.18, 'sine', 0.2); this.tone(2093, 0.25, 'sine', 0.14, 0.06); break;
      case 'levelup': [659, 784, 988, 1318, 1568].forEach((f, i) => this.tone(f, 0.2, 'square', 0.08, i * 0.08)); break;
      case 'tick': this.tone(1000, 0.05, 'square', 0.07); break;
      case 'go': this.tone(784, 0.12, 'square', 0.1); this.tone(1046, 0.3, 'square', 0.1, 0.1); break;
    }
  }
  sizzle(on) {
    if (!this.ctx) return;

      const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      s.buffer = this.noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 4200; f.Q.value = 0.7; g.gain.value = 0.045;

    } else if ((!on || !this.enabled) && this.sizzleNode) {
      try { this.sizzleNode.s.stop(); } catch (e) {} this.sizzleNode = null;
    }
  }
}

/* ---------- Rezeptlogik (rein datengetrieben) ---------- */
// Weg vom Rohzustand zum Zielzustand über die Arbeitsschritte einer Zutat (Breitensuche)
function findPath(id, target) {
  if (target === 'raw') return [];
  const def = INGREDIENTS[id]; if (!def) return null;
  const q = [['raw', []]], seen = new Set(['raw']);
  while (q.length) {
    const [st, path] = q.shift();
    for (const [proc, s] of Object.entries(def.steps?.[st] || {})) {
      const np = [...path, { proc, from: st, to: s.to, time: s.time }];
      if (s.to === target) return np;
      if (!seen.has(s.to)) { seen.add(s.to); q.push([s.to, np]); }
    }
  }
  return null;
}
// Ablauf eines Rezepts: je Komponente die Kette Quelle → Stationen (für Rezeptbuch, Bestellkarten, Küchenbedarf)
function recipeFlow(recipe) {
  return recipe.components.map(([id, state]) => {
    const def = INGREDIENTS[id];
    if (def.potResult) {
      const pr = POT_RECIPES[id];
      return { id, state, pot: { time: pr.time, needs: pr.needs.map(n => ({ id: n, state: INGREDIENTS[n].pot, path: findPath(n, INGREDIENTS[n].pot) || [] })) } };
    }
    return { id, state, path: findPath(id, state) || [] };
  });
}
function recipeNeeds(recipes) {
  const ings = new Set(), procs = new Set(), pots = new Set();
  for (const r of recipes) for (const f of recipeFlow(r)) {
    const add = x => { ings.add(x.id); x.path.forEach(p => procs.add(p.proc)); };
    if (f.pot) { procs.add('pot'); pots.add(f.id); f.pot.needs.forEach(add); } else add(f);
  }
  return { ings, procs, pots };
}
const partKey = p => p.id + ':' + p.state;
const recipeKeys = r => r.components.map(([i, s]) => i + ':' + s);
const plateSig = parts => parts.map(partKey).sort().join('|');
function exactRecipe(parts, recipes = RECIPES) { const k = plateSig(parts); return recipes.find(r => recipeKeys(r).sort().join('|') === k) || null; }
function nextProcHint(id, state) { const steps = INGREDIENTS[id]?.steps?.[state]; if (!steps) return null; return PROC[Object.keys(steps)[0]]?.need || null; }
function canAddToPlate(plate, part, recipes) {
  if (part.state === 'burnt') return 'Verbranntes gehört in den Müll';
  if (plate.parts.length >= CONFIG.PLATE.capacity) return 'Der Teller ist voll';
  if (plate.parts.some(p => p.id === part.id)) return 'Ist schon auf dem Teller';
  const k = partKey(part);
  if (!recipes.some(r => recipeKeys(r).includes(k))) {
    if (recipes.some(r => r.components.some(([i]) => i === part.id))) return nextProcHint(part.id, part.state) || 'Noch nicht fertig';
    if (INGREDIENTS[part.id]?.pot && recipes.some(r => r.components.some(([i]) => INGREDIENTS[i].potResult && POT_RECIPES[i].needs.includes(part.id))))
      return INGREDIENTS[part.id].pot === part.state ? 'Gehört in den Kochtopf' : (nextProcHint(part.id, part.state) || 'Gehört in den Kochtopf');
    return 'Wird heute nicht gebraucht';
  }
  const keys = [...plate.parts.map(partKey), k];
  return recipes.some(r => { const rk = recipeKeys(r); return keys.every(x => rk.includes(x)); }) ? null : 'Passt zu keinem Rezept';
}

class World {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;

    const hemi = new THREE.HemisphereLight(0xfff3df, 0x6d4c3d, 1.65); this.scene.add(hemi);
    this.sun = new THREE.DirectionalLight(0xfff1dc, 2.3);
    this.sun.position.set(2, 18, 12); this.sun.target.position.set(9, 0, 4.5);
    this.scene.add(this.sun, this.sun.target);
    const sc = this.sun.shadow.camera; sc.left = -16; sc.right = 16; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 60;
    this.sun.shadow.bias = -0.0006; this.sun.shadow.normalBias = 0.03;
    this.bounds = new THREE.Box3(new THREE.Vector3(-0.55, 0, -0.5), new THREE.Vector3(19.7, 4 * CONFIG.WALL_SCALE + 0.1, 10.7));
    this.view = { cx: 0, cy: 0, halfW: 10, halfH: 10, follow: false, ext: null };
    this.quality = 'high'; this.topPx = 0; this.bottomPx = 0;
  }
  setQuality(q) {
    this.quality = q; const Q = CONFIG.QUALITY[q] || CONFIG.QUALITY.medium;
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.dpr));
    const want = Q.shadow > 0;
    if (this.sun.shadow.map) { this.sun.shadow.map.dispose(); this.sun.shadow.map = null; }
    if (want) this.sun.shadow.mapSize.set(Q.shadow, Q.shadow);
    if (this.sun.castShadow !== want) { this.sun.castShadow = want; this.scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); }
    this.resize();
  }
  size() { const el = this.canvas.parentElement; return { w: el.clientWidth || innerWidth, h: el.clientHeight || innerHeight }; }
  resize() { const { w, h } = this.size(); this.renderer.setSize(w, h, false); this.fit(); }
  fit() {
    const { w, h } = this.size(), C = CONFIG.CAMERA;
    const az = THREE.MathUtils.degToRad(C.azimuthDeg), el = THREE.MathUtils.degToRad(C.elevationDeg);
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    const center = this.bounds.getCenter(new THREE.Vector3());
    this.camera.position.copy(center).addScaledVector(dir, 70); this.camera.lookAt(center); this.camera.updateMatrixWorld(true);
    const inv = this.camera.matrixWorldInverse, b = this.bounds, ext = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
    for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
      const p = new THREE.Vector3(x, y, z).applyMatrix4(inv);
      ext.minX = Math.min(ext.minX, p.x); ext.maxX = Math.max(ext.maxX, p.x); ext.minY = Math.min(ext.minY, p.y); ext.maxY = Math.max(ext.maxY, p.y);
    }
    // topPx: oben reservierter Streifen (Bestellkarten), nur wenn die Höhe der begrenzende Faktor ist
    const W = ext.maxX - ext.minX, H = ext.maxY - ext.minY, top = Math.min(this.topPx || 0, h * 0.3), bottom = Math.min(this.bottomPx || 0, h * 0.3), ha = h - top - bottom;
    let u = Math.max(W / w, H / ha);                 // Welt-Einheiten pro Pixel
    this.view.follow = 1 / u < C.minPixelsPerUnit;
    if (this.view.follow) u = 1 / C.minPixelsPerUnit;
    const halfW = w * u / 2, halfH = h * u / 2;

    if (!this.view.follow) {

    }

  }
  applyFrustum() {
    const v = this.view, c = this.camera;
    c.left = v.cx - v.halfW; c.right = v.cx + v.halfW; c.top = v.cy + v.halfH; c.bottom = v.cy - v.halfH; c.updateProjectionMatrix();
  }
  follow(dt, target, snap = false) {
    const v = this.view; if (!v.follow || !target || !v.ext) return;
    const p = target.clone().setY(1).applyMatrix4(this.camera.matrixWorldInverse), e = v.ext;
    const tx = (e.maxX - e.minX) <= v.halfW * 2 ? (e.minX + e.maxX) / 2 : clamp(p.x, e.minX + v.halfW, e.maxX - v.halfW);
    const ty = (e.maxY - e.minY) <= v.halfH * 2 ? (e.minY + e.maxY) / 2 : clamp(p.y, e.minY + v.halfH, e.maxY - v.halfH);
    const k = snap ? 1 : 1 - Math.exp(-CONFIG.CAMERA.followLerp * dt);
    v.cx = lerp(v.cx, tx, k); v.cy = lerp(v.cy, ty, k); this.applyFrustum();
  }
  toScreen(v3, out = { x: 0, y: 0, vis: true }) {
    const { w, h } = this.size(); const p = v3.clone().project(this.camera);
    out.x = (p.x * 0.5 + 0.5) * w; out.y = (-p.y * 0.5 + 0.5) * h; out.vis = p.x > -1.2 && p.x < 1.2 && p.y > -1.2 && p.y < 1.2; return out;
  }
  render() { this.renderer.render(this.scene, this.camera); }
}

}
const itemLabel = it => !it ? '' : it.kind === 'plate'
  ? (it.parts.length ? (exactRecipe(it.parts)?.name || 'Teller: ' + it.parts.map(p => INGREDIENTS[p.id].name).join(', ')) : 'Leerer Teller')
  : ingName(it.id, it.state);

class ItemView {
  constructor(assets) { this.assets = assets; }
  spec(id, state, mode) {
    const d = INGREDIENTS[id];
    const m = (mode && d[mode]?.[state]) || d.models[state] || d.models.raw || Object.values(d.models)[0];
    return typeof m === 'string' ? { model: m } : m;
  }
  fitted(spec, target) {
    const o = this.assets.instance(spec.model, { tint: spec.tint, normalize: true });
    const sz = this.assets.size(spec.model); const s = Math.min(1.25, target / Math.max(sz.x, sz.z, sz.y * 0.85));
    o.scale.setScalar(s); return { o, h: sz.y * s };
  }
  // liefert (und cached) das 3D-Objekt eines Gegenstands; bei Zustandswechsel wird es ersetzt
  objectFor(item) {
    const key = item.key; if (item.obj && item.objKey === key) return item.obj;
    const prev = item.obj, o = item.kind === 'plate' ? this.buildPlate(item.parts) : this.buildIngredient(item.id, item.state);
    if (prev && prev.parent) { const parent = prev.parent; parent.remove(prev); o.position.copy(prev.position); o.rotation.copy(prev.rotation); o.scale.copy(prev.scale); parent.add(o); }
    item.obj = o; item.objKey = key; return o;
  }
  buildIngredient(id, state) { const g = new THREE.Group(); g.add(this.fitted(this.spec(id, state), 0.9).o); return g; }
  buildPlate(parts) {
    const g = new THREE.Group(), A = this.assets;
    const rec = parts.length ? exactRecipe(parts) : null;
    if (rec?.model && A.has(rec.model)) { g.add(A.instance(rec.model, { normalize: true })); return g; }
    g.add(A.instance(ASSETS.roles.plate, { normalize: true }));
    const top = 0.09;
    if (parts.some(p => p.id === 'bun') && parts.length > 1) {
      let y = top;
      const add = (o, h) => { o.position.y = y; g.add(o); y += h * 0.9; };
      add(A.instance('food_ingredient_bun_bottom', { normalize: true }), A.size('food_ingredient_bun_bottom').y);
      for (const id of ['patty', 'vpatty', 'cheese', 'tomato', 'lettuce', 'onion']) {
        const p = parts.find(q => q.id === id); if (!p) continue;
        const { o, h } = this.fitted(this.spec(id, p.state, 'stack'), 0.74); add(o, h);
      }
      add(A.instance('food_ingredient_bun_top', { normalize: true }), 0.3);
      return g;
    }
    const n = parts.length;
    parts.forEach((p, i) => {
      const { o } = this.fitted(this.spec(p.id, p.state, 'plate'), n === 1 ? 0.7 : 0.5);
      if (n > 1) { const a = i / n * Math.PI * 2 + 0.7; o.position.set(Math.cos(a) * 0.19, top, Math.sin(a) * 0.19); } else o.position.y = top;
      g.add(o);
    });
    return g;
  }
}

/* =====================================================================
   10  STATIONEN & INTERAKTIONEN
   Jede Station: Typ, Position (Raster), Reichweite (rect), zulässige Aktionen (getAction)
   Zustände eines Vorgangs: leer → Zutat drin → in Bearbeitung → fertig (→ verbrannt) → abgeholt
   ===================================================================== */
class Station {
  constructor(game, def) {
    this.game = game; this.def = def; this.type = def.type; this.c = def.c; this.r = def.r;
    this.center = tileCenter(def.c, def.r); this.rotY = FACE[def.face] || 0;
    this.group = new THREE.Group(); this.group.position.copy(this.center); this.group.rotation.y = this.rotY;
    this.holder = new THREE.Group(); this.group.add(this.holder);
    this.item = null; this.topY = 1.0; this.itemScale = 0.8; this.ui = null; this.uiY = 2.0;
    this.ings = [].concat(def.ing || []); this.activeIngs = this.ings.slice();
    const h = CONFIG.TILE / 2;
    this.rect = { minX: this.center.x - h, maxX: this.center.x + h, minZ: this.center.z - h, maxZ: this.center.z + h };
  }
  get name() { return 'Arbeitsfläche'; }
  build() {}
  place(obj, x = 0, y = 0, z = 0) { obj.position.set(x, y, z); this.group.add(obj); return obj; }
  setHolder(y, scale) { this.topY = y; this.holder.position.set(0, y, 0); this.itemScale = scale; }
  extendRectFrom(obj) {
    // Kollisionsfläche um Modell-Überstände erweitern (z. B. Kühlschranktür), max. 0.35
    this.group.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(obj), r = this.rect, m = 0.35;
    r.minX = Math.max(Math.min(r.minX, b.min.x), r.minX - m); r.maxX = Math.min(Math.max(r.maxX, b.max.x), r.maxX + m);
    r.minZ = Math.max(Math.min(r.minZ, b.min.z), r.minZ - m); r.maxZ = Math.min(Math.max(r.maxZ, b.max.z), r.maxZ + m);
  }
  refresh() {
    this.holder.clear();
    if (this.item && this.showItem !== false) { const o = this.game.view.objectFor(this.item); o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.setScalar(this.itemScale); this.holder.add(o); }
  }
  putItem(it) { this.item = it; this.refresh(); this.game.sfx.play('drop'); }
  takeItem() { const it = this.item; this.item = null; this.refresh(); this.game.sfx.play('pickup'); return it; }
  accept() { return null; }
  getAction() { return slotAction(this, this.game); }
  update() {}
  uiState() { return null; }
}
// Allgemeine Ablage-/Aufnahme-/Kombinier-Logik für Stationen mit einem Platz
function slotAction(st, game) {
  const P = game.player, held = P.held, it = st.item, recipes = game.session.recipes;
  if (!held && !it) return { label: st.name, icon: 'hand', ok: false, reason: 'Hier liegt nichts' };
  if (!held && it) return { label: 'Nehmen', icon: 'hand', ok: true, run: () => P.take(st.takeItem()) };
  if (held && !it) {
    const reason = st.accept(held);
    return { label: 'Ablegen', icon: 'hand', ok: !reason, reason, run: () => st.putItem(P.drop()) };
  }
  if (held.kind === 'plate' && it.kind === 'ing') {
    const reason = canAddToPlate(held, it, recipes);
    return { label: 'Auf Teller', icon: 'plate', ok: !reason, reason, run: () => { const ing = st.takeItem(); held.parts.push({ id: ing.id, state: ing.state }); P.refreshHeld(); } };
  }
  if (held.kind === 'ing' && it.kind === 'plate') {
    const reason = canAddToPlate(it, held, recipes);
    return { label: 'Auf Teller', icon: 'plate', ok: !reason, reason, run: () => { const ing = P.drop(); it.parts.push({ id: ing.id, state: ing.state }); st.refresh(); game.sfx.play('drop'); } };
  }
  return { label: 'Belegt', icon: 'hand', ok: false, reason: 'Hier steht schon etwas' };
}

class CounterStation extends Station {
  get name() { return this.def.model === 'island' ? 'Anrichte' : 'Arbeitsfläche'; }
  build(A) {
    const role = this.def.model === 'island' ? ASSETS.roles.island : (this.def.alt ? ASSETS.roles.counterAlt : ASSETS.roles.counter);
    const m = this.place(A.instance(role)); this.extendRectFrom(m); this.setHolder(1.0, 0.82);
    if (this.def.decor) for (const d of this.def.decor) this.place(A.instance(d.model), d.x, 1.0, d.z).rotation.y = d.rot || 0;
  }
}

class BoardStation extends Station {
  get name() { return 'Schneidebrett'; }
  build(A) {
    this.place(A.instance(ASSETS.roles.steelTable));
    const board = this.place(A.instance(ASSETS.roles.board), -0.12, 1.0, 0.05);
    const knife = this.place(A.instance(ASSETS.roles.knife), 0.82, 1.06, -0.3); knife.rotation.set(Math.PI / 2, 0, 0.15);
    this.setHolder(1.15, 0.8); this.holder.position.x = -0.12;
    this.chopTick = 0; void board;
  }
  canChop() { return this.item?.kind === 'ing' && !!INGREDIENTS[this.item.id].steps?.[this.item.state]?.board; }
  getAction() {
    const P = this.game.player;
    if (!P.held && this.canChop()) {
      const working = P.workingAt === this;
      // erneutes Tippen während des Schneidens startet keinen zweiten Vorgang
      return { label: working ? 'Schneide …' : 'Schneiden', icon: 'knife', ok: true, run: () => { if (!working) P.startWork(this); } };
    }
    return slotAction(this, this.game);
  }
  update(dt) {
    const P = this.game.player;
    if (P.workingAt !== this) return;
    if (!this.canChop()) { P.stopWork(); return; }
    const step = INGREDIENTS[this.item.id].steps[this.item.state].board;
    this.item.work += dt / this.game.mods.prep;
    this.chopTick -= dt; if (this.chopTick <= 0) { this.chopTick = 0.26; this.game.sfx.play('chop'); }
    if (this.item.work >= step.time) { this.item.setState(step.to); this.refresh(); P.stopWork(); this.game.sfx.play('ding'); this.game.events.emit('processed', { item: this.item, proc: 'board' }); }
  }
  uiState() {
    if (!this.canChop() || this.item.work <= 0) return null;
    const step = INGREDIENTS[this.item.id].steps[this.item.state].board;
    return { bar: this.item.work / step.time, cls: 'chop', icon: SVG.knife };
  }
}

// Pfanne & Ofen: garen automatisch, danach läuft die Verbrennen-Uhr
class CookStation extends Station {
  constructor(game, def, proc) { super(game, def); this.proc = proc; this.warnTick = 0; }
  get name() { return PROC[this.proc].name; }
  build(A) {
    if (this.proc === 'pan') {
      const stove = this.place(A.instance(ASSETS.roles.stove)); this.extendRectFrom(stove);
      this.place(A.instance(ASSETS.roles.pan), 0, 1.2, -0.12);
      this.setHolder(1.27, 0.66); this.holder.position.z = -0.12;
    } else {
      const oven = this.place(A.instance(ASSETS.roles.oven)); this.extendRectFrom(oven);
      this.setHolder(2.05, 0.6); this.showItem = false;
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.62), new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.0, depthWrite: false }));
      glow.position.set(-0.27, 0.86, 1.045); this.group.add(glow); this.glow = glow;
    }
    this.uiY = this.proc === 'oven' ? 2.5 : 2.0;
  }
  accept(it) {
    if (it.kind !== 'ing') return `Teller gehört nicht ${this.proc === 'pan' ? 'in die Pfanne' : 'in den Ofen'}`;
    if (INGREDIENTS[it.id].steps?.[it.state]?.[this.proc] || it.burnAt === this.proc) return null;
    if (it.state === 'burnt') return 'Ist schon verbrannt';
    const hint = nextProcHint(it.id, it.state);
    return hint && !hint.includes(PROC[this.proc].verb) ? hint : `Kann man nicht ${PROC[this.proc].verb}`;
  }
  cooking() { return this.item?.kind === 'ing' && !!INGREDIENTS[this.item.id].steps?.[this.item.state]?.[this.proc]; }
  burning() { return this.item?.kind === 'ing' && this.item.burnAt === this.proc && this.item.state !== 'burnt'; }
  update(dt) {
    const it = this.item;
    if (this.glow) this.glow.material.opacity = (this.cooking() || this.burning()) ? 0.55 + Math.sin(performance.now() / 180) * 0.12 : 0;
    if (!it || it.kind !== 'ing') return;
    const step = INGREDIENTS[it.id].steps?.[it.state]?.[this.proc];
    if (step) {
      it.work += dt / this.game.mods.cook;
      if (it.work >= step.time) { it.setState(step.to); it.burnAt = this.proc; it.burn = 0; this.refresh(); this.game.sfx.play('ding'); this.game.events.emit('processed', { item: it, proc: this.proc }); }
    } else if (this.burning()) {
      it.burn += dt; const lim = CONFIG.COOK.burnDelay * this.game.mods.antiburn;
      if (it.burn >= lim) { it.setState('burnt'); it.burnAt = null; this.refresh(); this.game.onBurnt(this); }
      else if (it.burn >= lim * CONFIG.COOK.warnAt) { this.warnTick -= dt; if (this.warnTick <= 0) { this.warnTick = 0.7; this.game.sfx.play('warn'); } }
    }
  }
  uiState() {
    const it = this.item; if (!it || it.kind !== 'ing') return null;
    const icon = this.game.icons.get('ing:' + it.key);
    if (it.state === 'burnt') return { icon: SVG.smoke, img: icon, bar: 1, cls: 'burn', label: 'Verbrannt!' };
    const step = INGREDIENTS[it.id].steps?.[it.state]?.[this.proc];
    if (step) return { img: icon, bar: it.work / step.time, cls: '' };
    if (this.burning()) {
      const lim = CONFIG.COOK.burnDelay * this.game.mods.antiburn, f = it.burn / lim;
      return f >= CONFIG.COOK.warnAt ? { img: icon, icon: SVG.warn, bar: f, cls: 'burn', warn: true, label: 'Gleich verbrannt!' } : { img: icon, icon: SVG.check, bar: 1, cls: 'done' };
    }
    return { img: icon };
  }
}

class PotStation extends Station {
  constructor(game, def) { super(game, def); this.contents = []; this.progress = 0; this.burn = 0; this.burnt = false; this.warnTick = 0; }
  get name() { return 'Kochtopf'; }
  build(A) {
    const stove = this.place(A.instance(ASSETS.roles.stove)); this.extendRectFrom(stove);
    this.place(A.instance(ASSETS.roles.pot), 0, 1.2, 0);
    this.fill = A.instance(ASSETS.roles.potFill); this.fill.position.set(0, 1.2, 0); this.fill.visible = false; this.group.add(this.fill);
    this.fillTint = null; this.setHolder(1.7, 0.6); this.uiY = 2.2;
  }
  activePots() { return this.game.session?.needs.pots || new Set(); }
  match() {
    const sig = this.contents.slice().sort().join(',');
    for (const id of this.activePots()) if (POT_RECIPES[id].needs.slice().sort().join(',') === sig) return id;
    return null;
  }
  canAdd(it) {
    if (it.kind !== 'ing') return 'Teller passt nicht in den Topf';
    if (this.burnt) return 'Topf ist angebrannt – erst ausleeren';
    const potState = INGREDIENTS[it.id].pot;
    if (!potState) return 'Gehört nicht in den Topf';
    if (it.state !== potState) return nextProcHint(it.id, it.state) || 'Falscher Zustand';
    if (this.contents.length >= CONFIG.POT.capacity) return 'Der Topf ist voll';
    const next = [...this.contents, it.id];
    const fits = [...this.activePots()].some(pid => { const need = POT_RECIPES[pid].needs.slice(); return next.every(x => { const i = need.indexOf(x); if (i < 0) return false; need.splice(i, 1); return true; }); });
    return fits ? null : 'Passt in kein Topfgericht';
  }
  get done() { const m = this.match(); return !!m && !this.burnt && this.progress >= POT_RECIPES[m].time; }
  clear() { this.contents = []; this.progress = 0; this.burn = 0; this.burnt = false; this.updateFill(); }
  getAction() {
    const P = this.game.player, held = P.held, recipes = this.game.session.recipes;
    if (held?.kind === 'ing') {
      const reason = this.canAdd(held);
      return { label: 'In den Topf', icon: 'pot', ok: !reason, reason, run: () => { const it = P.drop(); this.contents.push(it.id); this.burn = 0; this.updateFill(); this.game.sfx.play('drop'); } };
    }
    if (held?.kind === 'plate') {
      if (this.burnt) return { label: 'Abfüllen', icon: 'pot', ok: false, reason: 'Angebrannt – mit leeren Händen ausleeren' };
      if (!this.contents.length) return { label: 'Abfüllen', icon: 'pot', ok: false, reason: 'Der Topf ist leer' };
      if (!this.done) return { label: 'Abfüllen', icon: 'pot', ok: false, reason: this.match() ? 'Kocht noch …' : 'Es fehlen noch Zutaten' };
      const part = { id: this.match(), state: 'cooked' }, reason = canAddToPlate(held, part, recipes);
      return { label: 'Abfüllen', icon: 'plate', ok: !reason, reason, run: () => { held.parts.push(part); this.clear(); P.refreshHeld(); this.game.sfx.play('pickup'); } };
    }
    if (this.burnt) return { label: 'Ausleeren', icon: 'trash', ok: true, run: () => { this.clear(); this.game.sfx.play('trash'); } };
    if (!this.contents.length) return { label: 'Kochtopf', icon: 'pot', ok: false, reason: 'Geschnittene Zutaten hineinlegen' };
    if (this.done) return { label: 'Abfüllen', icon: 'plate', ok: false, reason: 'Mit einem Teller abholen' };
    return { label: 'Kochtopf', icon: 'pot', ok: false, reason: this.match() ? 'Kocht noch …' : 'Es fehlen noch Zutaten' };
  }
  updateFill() {
    const f = this.fill; if (!f) return;
    f.visible = this.contents.length > 0;
    const m = this.match();
    let tint = 0xbfd7e6; // Wasser / unvollständig
    if (this.burnt) tint = 0x2f2622; else if (m) tint = POT_RECIPES[m].fill ?? null;
    if (tint !== this.fillTint) {
      this.fillTint = tint; const pos = f.position.clone(); this.group.remove(f);
      this.fill = this.game.assets.instance(ASSETS.roles.potFill, tint == null ? {} : { tint }); this.fill.position.copy(pos); this.fill.visible = f.visible; this.group.add(this.fill);
    }
    this.fill.scale.set(1, 0.6 + 0.4 * this.contents.length / CONFIG.POT.capacity, 1);
  }
  update(dt) {
    const m = this.match(); if (!m || this.burnt) return;
    const T = POT_RECIPES[m].time;
    if (this.progress < T) {
      this.progress += dt / this.game.mods.cook;
      if (this.progress >= T) { this.updateFill(); this.game.sfx.play('ding'); this.game.events.emit('processed', { proc: 'pot', result: m }); }
    } else {
      this.burn += dt; const lim = CONFIG.POT.burnDelay * this.game.mods.antiburn;
      if (this.burn >= lim) { this.burnt = true; this.updateFill(); this.game.onBurnt(this); }
      else if (this.burn >= lim * CONFIG.COOK.warnAt) { this.warnTick -= dt; if (this.warnTick <= 0) { this.warnTick = 0.7; this.game.sfx.play('warn'); } }
    }
  }
  uiState() {
    if (!this.contents.length) return null;
    const imgs = this.contents.map(id => this.game.icons.get('ing:' + id + ':' + INGREDIENTS[id].pot));
    if (this.burnt) return { imgs, icon: SVG.smoke, bar: 1, cls: 'burn', label: 'Angebrannt!' };
    const m = this.match();
    if (!m) { const need = Math.min(...[...this.activePots()].map(id => POT_RECIPES[id].needs.length).filter(n => n > this.contents.length)); return { imgs, label: `${this.contents.length}/${Number.isFinite(need) ? need : CONFIG.POT.capacity}` }; }
    const T = POT_RECIPES[m].time;
    if (this.progress < T) return { imgs, bar: this.progress / T, cls: '' };
    const lim = CONFIG.POT.burnDelay * this.game.mods.antiburn, f = this.burn / lim;
    const img = this.game.icons.get('ing:' + m + ':cooked');
    return f >= CONFIG.COOK.warnAt ? { img, icon: SVG.warn, bar: f, cls: 'burn', warn: true, label: 'Gleich angebrannt!' } : { img, icon: SVG.check, bar: 1, cls: 'done' };
  }
}

class SourceStation extends Station {
  get model() { return INGREDIENTS[this.ings[0]].source; }
  get name() { return this.model.startsWith('fridge') ? 'Kühlschrank' : 'Kiste'; }
  build(A) {
    const m = this.place(A.instance(this.model)); this.extendRectFrom(m);
    const fridge = this.model.startsWith('fridge'), list = this.activeIngs.length ? this.activeIngs : this.ings;
    this.setHolder(fridge ? 2.5 : 0.95, 0.6);
    // Kühlschrank: Inhalt oben drauf zeigen (bei mehreren Zutaten nebeneinander)
    if (fridge) list.forEach((id, i) => { const o = this.game.view.buildIngredient(id, 'raw'); o.scale.setScalar(list.length > 1 ? 0.6 : 0.75); o.position.set(list.length > 1 ? (i - (list.length - 1) / 2) * 0.75 : 0, 2.5, 0.1); this.group.add(o); });
    this.uiY = fridge ? 3.2 : 1.7;
  }
  getAction() {
    const P = this.game.player, held = P.held, list = this.activeIngs.length ? this.activeIngs : this.ings;
    const nm = id => INGREDIENTS[id].short || INGREDIENTS[id].name, first = list[0];
    if (!held) return { label: 'Nimm ' + nm(first), icon: 'box', ok: true, run: () => { P.take(new Ingredient(first)); this.game.sfx.play('pickup'); } };
    if (held.kind === 'ing' && held.state === 'raw' && list.includes(held.id)) {
      if (list.length > 1) {
        const next = list[(list.indexOf(held.id) + 1) % list.length];
        return { label: 'Tausch: ' + nm(next), icon: 'box', ok: true, run: () => { P.drop(); P.take(new Ingredient(next)); this.game.sfx.play('pickup'); } };
      }
      return { label: 'Zurücklegen', icon: 'box', ok: true, run: () => { P.drop(); this.game.sfx.play('drop'); } };
    }
    if (held.kind === 'plate') {
      const id = list.find(i => !canAddToPlate(held, { id: i, state: 'raw' }, this.game.session.recipes));
      if (id) return { label: nm(id) + ' auf Teller', icon: 'plate', ok: true, run: () => { held.parts.push({ id, state: 'raw' }); P.refreshHeld(); this.game.sfx.play('pickup'); } };
      return { label: 'Nimm ' + nm(first), icon: 'box', ok: false, reason: 'Hände voll – Teller erst abstellen' };
    }
    return { label: 'Nimm ' + nm(first), icon: 'box', ok: false, reason: 'Hände voll' };
  }
}

class PlatesStation extends Station {
  get name() { return 'Tellerstapel'; }
  build(A) {
    const m = this.place(A.instance(this.def.model === 'island' ? ASSETS.roles.island : ASSETS.roles.counterAlt)); this.extendRectFrom(m);
    for (let i = 0; i < 5; i++) this.place(A.instance(ASSETS.roles.plate), 0, 1.0 + i * 0.075, 0).rotation.y = i * 0.4;
    this.setHolder(1.4, 0.8);
  }
  getAction() {
    const P = this.game.player, held = P.held;
    if (!held) return { label: 'Teller nehmen', icon: 'plate', ok: true, run: () => { P.take(new Plate()); this.game.sfx.play('pickup'); } };
    if (held.kind === 'plate' && !held.parts.length) return { label: 'Teller zurück', icon: 'plate', ok: true, run: () => { P.drop(); this.game.sfx.play('drop'); } };

function createStation(game, def) {
  switch (def.type) {
    case 'board': return new BoardStation(game, def);
    case 'pan': return new CookStation(game, def, 'pan');
    case 'oven': return new CookStation(game, def, 'oven');
    case 'pot': return new PotStation(game, def);
    case 'source': return new SourceStation(game, def);
    case 'plates': return new PlatesStation(game, def);
    case 'trash': return new TrashStation(game, def);
    case 'pass': return new PassStation(game, def);
    case 'decor': return new DecorStation(game, def);
    default: return new CounterStation(game, def);
  }
}

class Player {

      if (f !== e.frac) { e.frac = f; e.ring.innerHTML = ringSVG(f, patienceColor(f)); }
      // Sprechblase rechts neben dem Kopf; passt sie dort nicht auf den Bildschirm, dann über den Kopf (innerhalb des Rands)
      const sw = W.size().w, compact = sw < 600;
      if (e.compact !== compact) { e.compact = compact; e.el.classList.toggle('compact', compact); e.w = 0; }
      if (!e.w) e.w = e.el.offsetWidth || 86;
      v.copy(o.guest.root.position); v.y = 2.1; W.toScreen(v, p);
      if (p.x + 14 + e.w <= sw - 4) e.el.style.transform = `translate(${(p.x + 14).toFixed(1)}px,${p.y.toFixed(1)}px) translate(0,-50%)`;
      else {
        v.y = 2.8; W.toScreen(v, p);
        e.el.style.transform = `translate(${clamp(p.x - e.w / 2, 4, sw - e.w - 4).toFixed(1)}px,${p.y.toFixed(1)}px) translate(0,-100%)`;
      }
    }
    for (const [id, e] of this.guestEls) if (!alive.has(id)) { e.el.remove(); this.guestEls.delete(id); }
  }
}

/* =====================================================================
   18  TUTORIAL (nur echte, spielbare Schritte)
   ===================================================================== */
class Tutorial {
  constructor(game) {
    this.g = game; this.active = false; this.i = 0; this.banner = $('#tutorial-banner');
    const g = game, K = () => g.kitchen, find = (type, pred) => K().stations.find(s => s.type === type && (!pred || pred(s)));
    const anyIng = (id, state) => (g.player.held?.kind === 'ing' && g.player.held.id === id && g.player.held.state === state) || K().stations.some(s => s.item?.kind === 'ing' && s.item.id === id && s.item.state === state);
    const holds = (id) => g.player.held?.kind === 'ing' && g.player.held.id === id;
    const plateWith = (k) => [g.player.held, ...K().stations.map(s => s.item)].some(it => it?.kind === 'plate' && it.parts.some(p => partKey(p) === k));
    this.steps = [
      { text: 'Willkommen in deiner Küche! Lauf herum: Daumen links aufs Display legen und ziehen (oder WASD).', check: () => g.player.moved > 3 },
      { text: 'Gast 1 möchte einen Salat. Geh zur markierten Salat-Kiste und drück die Aktionstaste.', enter: () => g.session.orders.spawn(),
        target: () => find('source', s => s.ings.includes('lettuce')), check: () => holds('lettuce') || anyIng('lettuce', 'chopped') },
      { text: 'Leg den Salat aufs Schneidebrett und tippe auf „Schneiden“. Stehen bleiben, bis der Balken voll ist.',
        target: () => holds('lettuce') ? find('board', s => !s.item) || find('board') : find('board', s => s.item?.id === 'lettuce') || find('board'), check: () => anyIng('lettuce', 'chopped') || plateWith('lettuce:chopped') },
      { text: 'Super! Jetzt dasselbe mit einer Tomate: holen und schneiden.',
        target: () => holds('tomato') ? find('board', s => !s.item) || find('board') : (find('board', s => s.item?.id === 'tomato') || find('source', s => s.ings.includes('tomato'))), check: () => anyIng('tomato', 'chopped') || plateWith('tomato:chopped') },
      { text: 'Hol einen Teller vom Tellerstapel. Mit Teller in der Hand nimmst du die geschnittenen Zutaten direkt auf.',
        target: () => g.player.held?.kind === 'plate' ? find('board', s => s.item?.kind === 'ing') : find('plates'), check: () => [g.player.held, ...K().stations.map(s => s.item)].some(it => it?.kind === 'plate' && exactRecipe(it.parts)?.id === 'salat') },
      { text: 'Fertig! Bring den Salat zur Ausgabe 1 vor Gast 1 und tippe auf „Servieren“.',
        target: () => find('pass', s => s.def.slot === (g.session.orders.active[0]?.slot ?? 0)), check: () => g.session.served >= 1 },
      { text: 'Gast 2 möchte einen Burger. Hol ein Patty aus dem markierten Kühlschrank und leg es in die Pfanne.', enter: () => g.session.orders.spawn(),
        target: () => holds('patty') ? find('pan', s => !s.item) || find('pan') : find('source', s => s.ings.includes('patty')), check: () => K().stationsOf('pan').some(s => s.item?.id === 'patty') || anyIng('patty', 'fried') || plateWith('patty:fried') },
      { text: 'Die Pfanne brät von allein. Hol inzwischen einen Teller und leg ein Brötchen darauf.',
        target: () => g.player.held?.kind === 'plate' ? find('source', s => s.ings.includes('bun')) : find('plates'), check: () => plateWith('bun:raw') },
      { text: 'Nimm das gebratene Patty mit dem Teller aus der Pfanne, bevor es verbrennt (rotes !). Dann zu Gast 2 und servieren.',
        target: () => { const hp = g.player.held; if (hp?.kind === 'plate' && exactRecipe(hp.parts)?.id === 'burger') return find('pass', s => s.def.slot === (g.session.orders.active[0]?.slot ?? 1)); return find('pan', s => s.item?.id === 'patty') || find('source', s => s.ings.includes('patty')); },
        check: () => g.session.served >= 2 },
    ];
  }
  start() { this.active = true; this.i = -1; this.next(); }
  stop() { this.active = false; this.banner.hidden = true; if (this.g.kitchen.arrow) this.g.kitchen.arrow.visible = false; }
  next() {
    this.i++;
    const st = this.steps[this.i]; if (!st) { this.banner.hidden = true; return; }
    st.enter?.();
    this.banner.hidden = false; this.banner.querySelector('.step').textContent = this.i + 1; this.banner.querySelector('.txt').textContent = st.text;
    this.g.sfx.play('click');
  }
  update(dt) {
    if (!this.active) return;
    const st = this.steps[this.i]; if (!st) return;
    if (st.check()) { this.next(); return; }
    const arrow = this.g.kitchen.arrow, tgt = this.g.save.data.settings.hints ? st.target?.() : null;
    arrow.visible = !!tgt;
    if (tgt) { arrow.position.set(tgt.center.x, tgt.topY + 1.0 + Math.sin(performance.now() / 220) * 0.15 + (tgt.type === 'source' && tgt.topY > 2 ? 0.2 : 0.6), tgt.center.z); }
    void dt;
  }
}

    const r = RECIPE_BY_ID[id], s = this.save.data; if (!r) return;
    if (s.recipes.includes(id)) { this.hud.toast('Schon gekauft'); return; }
    if (levelInfo(s.xp).level < (r.unlock.level || 1)) { this.hud.toast(`Erst ab Spielerlevel ${r.unlock.level}`, 'bad'); return; }
    if (s.coins < r.unlock.cost) { this.hud.toast(`Dir fehlen ${r.unlock.cost - s.coins} Münzen`, 'bad'); this.sfx.play('error'); return; }
    this.busy = true; s.coins -= r.unlock.cost; s.recipes.push(id); this.sfx.play('buy'); this.kitchenDirty = true;
    this.hud.toast(`${r.name} freigeschaltet!`, 'good'); this.ui.showShop('recipes');
    this.save.save().then(ok => { this.busy = false; if (!ok) this.hud.toast('Kauf gilt, aber Speichern schlug fehl', 'bad'); });
  }
  buyUpgrade(id) {
    if (this.busy) return;
    const u = UPGRADE_BY_ID[id], s = this.save.data; if (!u) return;
    const lv = s.upgrades[id] || 0;
    if (lv >= u.costs.length) { this.hud.toast('Schon auf Maximalstufe'); return; }
    const cost = u.costs[lv];
    if (s.coins < cost) { this.hud.toast(`Dir fehlen ${cost - s.coins} Münzen`, 'bad'); this.sfx.play('error'); return; }
    this.busy = true; s.coins -= cost; s.upgrades[id] = lv + 1; this.computeMods(); this.sfx.play('buy');
    this.hud.toast(`${u.name} Stufe ${lv + 1}!`, 'good'); this.ui.showShop('upgrades');
    this.save.save().then(ok => { this.busy = false; if (!ok) this.hud.toast('Kauf gilt, aber Speichern schlug fehl', 'bad'); });
  }
  saveFileName() { return `giddis-kitchen-husch-spielstand-${new Date().toISOString().slice(0, 10)}.json`; }
  downloadSave() {
    // Download-Link; falls der Browser ihn blockiert, bleiben Teilen und Kopieren als Wege
    try {
      const blob = new Blob([this.save.exportJSON()], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = this.saveFileName();
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch (e) { this.hud.toast('Datei speichern geht hier nicht – nutze „Text kopieren“', 'bad'); }
  }
  shareSave() {
    try {
      const file = new File([this.save.exportJSON()], this.saveFileName(), { type: 'application/json' });
      navigator.share({ files: [file], title: CONFIG.GAME_NAME + ' – Spielstand' }).then(() => this.hud.toast('Spielstand geteilt', 'good')).catch(() => {});
    } catch (e) { this.hud.toast('Teilen geht hier nicht – nutze „Text kopieren“', 'bad'); }
  }
  copySave() {
    const ta = $('#export-text'), text = this.save.exportJSON();
    const fallback = () => { if (ta) { ta.focus(); ta.select(); } this.hud.toast('Text ist markiert – bitte kopieren', ''); };
    try { navigator.clipboard.writeText(text).then(() => this.hud.toast('Spielstand-Text kopiert', 'good')).catch(fallback); } catch (e) { fallback(); }
  }
  async resetSave() {
    const ok = await this.save.reset(); this.applySettings(); this.computeMods(); this.buildMenuScene();
    this.hud.toast(ok ? 'Spielstand zurückgesetzt' : 'Zurückgesetzt (Speichern fehlgeschlagen)', ok ? 'good' : 'bad'); this.toMenu();
  }
  toggleFullscreen() {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el)?.catch?.(() => this.hud.toast('Vollbild nicht erlaubt'));
    } catch (e) { this.hud.toast('Vollbild wird hier nicht unterstützt'); }
  }
  versionTap() { if (++this.vtaps >= CONFIG.DEBUG_TAPS && !this.debug) { this.debug = true; this.enableDebug(); this.hud.toast('Debug-Ansicht aktiv'); this.ui.showSettings(this.ui.ret); } }
  // ---- Hauptschleife ----
  update(dt) {
    const mv = this.input.poll();
    this.player.update(dt, mv);
    this.kitchen.update(dt);
    this.session.update(dt);
    if (this.state !== 'playing') return;
    this.target = this.kitchen.findTarget(this.player.pos, this.player.facing);
    const m = this.kitchen.marker;
    if (this.target) { m.visible = true; m.position.set(this.target.center.x, this.target.topY + 0.04, this.target.center.z); m.material.opacity = 0.65 + Math.sin(performance.now() / 160) * 0.25; }
    else m.visible = false;
    this.hud.setAction(this.target ? this.target.getAction() : null);
    this.sfx.sizzle(this.kitchen.stations.some(s => (s.type === 'pan' && (s.cooking?.() || s.burning?.())) || (s.type === 'pot' && s.contents.length && s.match() && !s.burnt)));
    this.world.follow(dt, this.player.pos);
    this.hud.update(dt);
    this.tutorial.update(dt);
  }
  loop(t) {
    requestAnimationFrame(this.loop);
    const now = t / 1000; let dt = this.last ? now - this.last : 0; this.last = now; dt = Math.min(dt, 0.1);
    try {
      const st = this.state;
      if (st === 'playing') { if (dt > 0.034) { this.update(dt / 2); if (this.state === 'playing') this.update(dt / 2); } else this.update(dt); }
      else if (st === 'countdown') { this.player.update(dt, { x: 0, y: 0 }); this.world.follow(dt, this.player.pos); this.hud.update(0); }
      else if (st === 'levelComplete' || st === 'gameOver') { this.player.rig.update(dt); this.session?.orders.guests.forEach(g => g.update(dt)); this.session && (this.session.orders.guests = this.session.orders.guests.filter(g => { if (g.done) { this.world.scene.remove(g.root); return false; } return true; })); }
      else if (st === 'menu') { this.menuAcc += dt; if (this.menuAcc < 1 / 30) return; this.player.rig.update(this.menuAcc); this.menuAcc = 0; }
      else if (st === 'paused') { if (this.pausedRendered) return; this.pausedRendered = true; }
      if (st !== 'paused') this.pausedRendered = false;
      this.hud.updateWorld();
      this.world.render();
    } catch (e) { this.reportError(e); }
    if (this.debug) this.debugTick(dt);
  }
  // Test-Hilfe: Spielzeit in festen Schritten simulieren (ohne Rendern)
  simulate(sec, step = 1 / 30) {
    for (let t = 0; t < sec && this.state === 'playing'; t += step) this.update(step);
    this.hud.updateWorld(); this.world.render();
  }
  reportError(e) {
    console.error(e);
    const now = performance.now(); if (this._lastErr && now - this._lastErr < 4000) return; this._lastErr = now;
    this.hud?.toast('Fehler: ' + (e?.message || e), 'bad');
  }
  // ---- Debug (nur mit ?debug oder 7× auf die Versionsnummer tippen) ----
  enableDebug() {
    if ($('#debug-panel')) return;
    const p = document.createElement('div'); p.id = 'debug-panel';
    const b = (label, fn) => { const x = document.createElement('button'); x.textContent = label; x.addEventListener('click', () => { try { fn(); } catch (e) { console.error(e); } }); p.appendChild(x); };
    const fps = document.createElement('div'); fps.className = 'fps'; p.appendChild(fps); this.fpsEl = fps;
    b('+500 Münzen', () => { this.save.data.coins += 500; this.save.save(); this.ui.cur === 'menu' && this.ui.showMenu(); });
    b('+150 XP', () => { this.save.data.xp += 150; this.save.save(); });
    b('Alle Level', () => { LEVELS.forEach(L => { this.save.data.levels[L.id] = { stars: 1, best: 0, completed: true, plays: 1, ...(this.save.data.levels[L.id] || {}), completed: true }; }); this.save.save(); });
    b('Alle Rezepte', () => { this.save.data.recipes = RECIPES.map(r => r.id); this.kitchenDirty = true; this.save.save(); });
    b('Upgrades max', () => { UPGRADES.forEach(u => this.save.data.upgrades[u.id] = u.costs.length); this.computeMods(); this.save.save(); });
    b('Gast +', () => { if (this.session) { this.session.orders.holdSpawns = false; this.session.orders.spawn(); } });
    b('−30 s', () => { if (this.session) this.session.timeLeft = Math.max(1, this.session.timeLeft - 30); });
    b('Level ★★★', () => { if (this.session) { this.session.score = this.session.maxPoints; this.endLevel('done'); } });
    b('Kollision', () => this.toggleColliders());
    b('Schließen', () => { p.remove(); this.debug = false; });
    $('#app').appendChild(p);
  }
  toggleColliders() {
    if (this.colGroup) { this.world.scene.remove(this.colGroup); this.colGroup = null; return; }
    this.colGroup = new THREE.Group();
    for (const r of this.kitchen.colliders) { const m = new THREE.Mesh(new THREE.BoxGeometry(r.maxX - r.minX, 0.1, r.maxZ - r.minZ), new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.35 })); m.position.set((r.minX + r.maxX) / 2, 3.2, (r.minZ + r.maxZ) / 2); this.colGroup.add(m); }
    this.world.scene.add(this.colGroup);
  }
  debugTick(dt) {
    const f = this.fps; f.t += dt; f.n++;
    if (f.t >= 0.5) { f.v = Math.round(f.n / f.t); f.t = 0; f.n = 0; if (this.fpsEl) this.fpsEl.textContent = `FPS ${f.v} · Draw ${this.world.renderer.info.render.calls} · Tri ${this.world.renderer.info.render.triangles} · ${this.state}`; }
  }
}

/* =====================================================================
   20  PWA, FEHLERBEHANDLUNG, START
   ===================================================================== */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const secure = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!secure) return;
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker nicht registriert:', e)));
}
const game = new Game();
window.__game = game; // für Tests/Debug in der Konsole
window.__kr = { CONFIG, RECIPES, RECIPE_BY_ID, INGREDIENTS, LEVELS, UPGRADES, recipeFlow, itemLabel, exactRecipe, levelInfo };
window.addEventListener('error', e => { if (game.hud) game.reportError(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { if (game.hud) game.reportError(e.reason); });
registerSW();
game.boot().catch(e => {
  console.error(e);
  $('#loading-msg').innerHTML = `<span class="err">Das Spiel konnte nicht starten: ${esc(e?.message || e)}</span><br>Bitte neu laden. Benötigt einen aktuellen Browser mit WebGL.`;
});
</script>
