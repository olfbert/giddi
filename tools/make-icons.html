<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Icon-Generator</title></head>
<body style="background:#333;color:#fff;font-family:sans-serif">
<p>Rendert das App-Icon aus dem KayKit-Burger-Modell. Öffnen über einen lokalen Server (z. B. <code>python3 -m http.server</code> im Projektordner) unter <code>/tools/make-icons.html</code>; die PNGs erscheinen unten zum Speichern.</p>
<div id="out"></div>
<script type="module">
import * as THREE from '../lib/three/three.module.min.js';
import { GLTFLoader } from '../lib/three/addons/loaders/GLTFLoader.js';
const gl = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
gl.setPixelRatio(1); gl.setSize(1024, 1024, false); gl.outputColorSpace = THREE.SRGBColorSpace; gl.setClearColor(0, 0);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a6a55, 2.4));
const d = new THREE.DirectionalLight(0xffffff, 1.8); d.position.set(2, 4, 3); scene.add(d);
const g = await new GLTFLoader().loadAsync('../assets/restaurant/food_burger.gltf');
scene.add(g.scene);
const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), r = box.getBoundingSphere(new THREE.Sphere()).radius * 0.86;
const cam = new THREE.OrthographicCamera(-r, r, r, -r, 0.1, 100);
cam.position.copy(c).add(new THREE.Vector3(0.45, 0.75, 1).normalize().multiplyScalar(20)); cam.lookAt(c);
gl.render(scene, cam);
function icon(size, pad, rounded) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; const x = cv.getContext('2d');
  const grd = x.createRadialGradient(size * 0.5, size * 0.38, size * 0.05, size * 0.5, size * 0.5, size * 0.75);
  grd.addColorStop(0, '#ffd68a'); grd.addColorStop(0.55, '#f08a4b'); grd.addColorStop(1, '#a8452a');
  x.fillStyle = grd;
  if (rounded) { x.beginPath(); x.roundRect(0, 0, size, size, size * 0.22); x.fill(); } else x.fillRect(0, 0, size, size);
  x.fillStyle = '#ffffff22'; x.beginPath(); x.arc(size * 0.5, size * 0.56, size * (0.5 - pad) * 0.92, 0, Math.PI * 2); x.fill();
  const s = size * (1 - pad * 2); x.drawImage(gl.domElement, size * pad, size * pad - size * 0.02, s, s);
  return cv.toDataURL('image/png');
}
const out = { 'icon-512.png': icon(512, 0.1, false), 'icon-192.png': icon(192, 0.1, false), 'apple-touch-icon.png': icon(180, 0.1, false), 'icon-maskable-512.png': icon(512, 0.2, false) };
window.__icons = out;
for (const [n, u] of Object.entries(out)) { const a = document.createElement('a'); a.href = u; a.download = n; a.innerHTML = `<img src="${u}" width="128" style="margin:6px"><br>${n}`; a.style.display = 'inline-block'; document.getElementById('out').appendChild(a); }
document.title = 'done';
</script></body></html>
